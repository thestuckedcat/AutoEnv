[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoenv"
version = "0.2.0"
description = "Sequential remote environment setup utilities for Windows"
requires-python = ">=3.11"
dependencies = [
  "paramiko>=3.0",
  "requests>=2.28",
  "scp>=0.14",
  "urllib3>=1.26",
  "pywinpty>=2.0.10; platform_system == 'Windows'",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
autoenv = "autoenv.cli:main"

[tool.setuptools.packages.find]
include = ["autoenv*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
