<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>AutoEnv // Control Plane</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><div class="brand-mark"><span>λ</span></div><div><div class="brand-title">AUTOENV // CONTROL PLANE</div><div class="brand-sub">REMOTE ENVIRONMENT ORCHESTRATOR</div></div></div>
      <div class="top-status"><span class="pill"><span class="pulse"></span><span id="bridgeLabel">DEMO BRIDGE</span></span><span class="pill" id="clock">--:--:--</span></div>
    </header>
    <div class="workspace">
      <aside class="panel sidebar">
        <div class="panel-head"><div><div class="eyebrow">01 // SELECT TARGET</div><div class="panel-title">环境脚本</div></div><div class="count">04 ONLINE</div></div>
        <div class="script-list" id="scriptList"></div>
        <div class="config">
          <div><div class="label-row"><span>执行模式</span><span class="hint">RUN MODE</span></div><div class="segmented" id="modeSwitch"><button class="active" data-mode="run">RUN / 逐项确认</button><button data-mode="rerun">RERUN / 复用参数</button></div></div>
          <div><div class="label-row"><span>Package 路径策略</span><span class="hint">PATH POLICY</span></div><select id="packagePolicy"><option value="default">沿用上次确认值</option><option value="!newest">!newest · automatic newest</option><option value="manual">运行时手工输入</option></select></div>
          <div class="run-row"><button class="run-btn" id="runBtn">▶ INITIALIZE RUN</button><button class="stop-btn" id="stopBtn" title="停止当前任务" disabled>■</button></div>
        </div>
      </aside>
      <main class="panel main">
        <div class="main-toolbar"><div class="toolbar-title"><span>root@autoenv:~$</span> LIVE OUTPUT</div><input class="filter-input" id="filterInput" placeholder="filter / highlight..." aria-label="筛选输出"><button class="tool-btn active" id="scrollBtn">AUTO-SCROLL</button><button class="tool-btn" id="clearBtn">CLEAR</button><button class="tool-btn" id="exportBtn">EXPORT LOG</button></div>
        <div class="terminal-wrap">
          <div class="terminal" id="terminal" role="log" aria-live="polite"></div>
          <form class="prompt-card" id="promptCard"><div><div class="prompt-meta"><span>◆ INPUT REQUIRED</span><span id="promptStep">01 / 06</span></div><div class="prompt-label" id="promptLabel">等待任务启动</div><input class="prompt-input" id="promptInput" autocomplete="off"><div class="prompt-help" id="promptHelp">Enter 使用默认值 · Ctrl+Enter 提交 · Esc 停止</div></div><button class="submit-btn" type="submit">SUBMIT ↵</button></form>
        </div>
      </main>
    </div>
  </div>
  <div class="footer-strip">CTRL+ENTER · RUN / SUBMIT &nbsp;&nbsp; ESC · ABORT</div><div class="toast" id="toast"></div>
  <script src="./bridge.js"></script>
  <script src="./app.js"></script>
</body>
</html>
